services:
  cv-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      CV_MAX_FILE_SIZE_MB: ${CV_MAX_FILE_SIZE_MB:-10}
      CV_MAX_TEXT_CHARS: ${CV_MAX_TEXT_CHARS:-100000}
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: ${CV_MAX_FILE_SIZE_MB:-10}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    restart: unless-stopped

