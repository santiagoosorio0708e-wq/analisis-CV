[theme]
base = "dark"
primaryColor = "#20C77A"
backgroundColor = "#0E0F11"
secondaryBackgroundColor = "#17191C"
textColor = "#F4F5F6"
font = "sans-serif"

[server]
port = 8502
address = "127.0.0.1"
headless = true
maxUploadSize = 10
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
